name: Offline Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pricepulse_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: pricepulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pricepulse_test -d pricepulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PRICEPULSE_TEST_DSN: postgresql://pricepulse_test:synthetic_ci_only@localhost:5432/pricepulse_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Run synthetic tests
        run: uv run --locked python -m pytest -q
